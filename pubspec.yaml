name: islamic_app
description: A comprehensive, production-ready Islamic mobile application with clean architecture, Riverpod state management, and offline-first design.
publish_to: 'none'
# The build number is only a floor: CI overrides it with the workflow run
# number, so the versionCode always increases and Android always treats a new
# APK as an upgrade. This value decides only what a locally built APK reports,
# and it is kept near the published build so a local build does not announce
# every release as an update to itself. The name is what people read.
version: 1.2.0+31

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  dio: ^5.8.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  intl: any
  geolocator: ^14.0.0
  geocoding: ^5.0.0
  flutter_compass: ^0.8.1
  just_audio: ^0.10.4
  flutter_local_notifications: ^22.3.0
  flutter_svg: ^2.3.0
  animations: ^2.0.11
  shimmer: ^3.0.0
  timezone: ^0.11.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  url_launcher: ^6.3.2
  logger: ^2.6.0
  adhan: ^2.0.0+1
  quran: ^1.4.1
  hijri: ^3.0.1
  flutter_timezone: ^5.1.0
  just_audio_background: ^0.0.1-beta.17
  wakelock_plus: ^1.7.0
  screenshot: ^3.0.0
  share_plus: ^13.3.0
  screen_brightness: ^2.1.11
  home_widget: ^0.9.3
  file_picker: ^12.0.0
  path_provider: ^2.1.6
  video_player: ^2.14.0
  speech_to_text: ^7.4.0
  sherpa_onnx: ^1.13.6
  archive: ^4.1.0
  record: ^7.1.1
  package_info_plus: ^10.2.1
  ota_update: ^7.1.0
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/video/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
    # Quran text faces, bundled so the reader works with no network (OFL 1.1).
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
    # Display face for headings and Surah names (SIL OFL 1.1).
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi.ttf

# Regenerate the sources first: python3 scripts/brand_assets.py
# Then fan them out:      dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "icon.png"
  # Adaptive icons are three separate layers, not one picture. The background
  # is the app's own cream — flat, because the launcher may parallax the two
  # layers against each other and anything textured smears when it does.
  adaptive_icon_background: "#F6F0E4"
  adaptive_icon_foreground: "assets/brand/icon-foreground.png"
  # Android 13 themed icons: the system throws away every colour and recolours
  # this silhouette to the wallpaper. It is the same drawing carrying the kerf,
  # which is what stops the sun and the book merging into one blob.
  adaptive_icon_monochrome: "assets/brand/icon-monochrome.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "icon.png"
    background_color: "#F6F0E4"
    theme_color: "#0F6B4F"
