name: islamic_app
description: A comprehensive, production-ready Islamic mobile application with clean architecture, Riverpod state management, and offline-first design.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Dependency Injection
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.3
  
  # Routing
  go_router: ^14.8.0
  
  # Networking
  dio: ^5.8.0
  
  # Local Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.1
  
  # Localization & Internationalization
  intl: ^0.20.2
  
  # Location Services
  geolocator: ^13.0.2
  
  # Compass
  flutter_compass: ^0.8.0
  
  # Audio Playback
  just_audio: ^0.9.42
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  
  # UI/UX
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  animations: ^2.0.11
  shimmer: ^3.0.0
  
  # DateTime & Timezone
  timezone: ^0.9.4
  
  # Utilities
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.12
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/data/
    - assets/images/
    - assets/icons/
  
  # Fonts (Cairo for RTL Arabic support)
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
    
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
  
  # Code Generation
  build_runner: ^2.4.15
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/data/
    - assets/images/
    - assets/icons/

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
