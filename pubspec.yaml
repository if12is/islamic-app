name: islamic_app
description: A comprehensive, production-ready Islamic mobile application with clean architecture, Riverpod state management, and offline-first design.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  dio: ^5.8.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  intl: any
  geolocator: ^14.0.0
  geocoding: ^5.0.0
  flutter_compass: ^0.8.1
  just_audio: ^0.10.4
  flutter_local_notifications: ^22.3.0
  google_fonts: ^8.2.1
  flutter_svg: ^2.1.0
  animations: ^2.0.11
  shimmer: ^3.0.0
  timezone: ^0.11.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  logger: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/icons/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "icon.png"
  min_sdk_size: 21
  web:
    generate: true
    image_path: "icon.png"
    background_color: "#003527"
    theme_color: "#003527"
