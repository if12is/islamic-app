name: islamic_app
description: A comprehensive, production-ready Islamic mobile application with clean architecture, Riverpod state management, and offline-first design.
publish_to: 'none'
# The build number is only a floor: CI overrides it with the run number so it
# always increases. The name is what people read.
version: 1.1.0+3

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  dio: ^5.8.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  intl: any
  geolocator: ^14.0.0
  geocoding: ^5.0.0
  flutter_compass: ^0.8.1
  just_audio: ^0.10.4
  flutter_local_notifications: ^22.3.0
  flutter_svg: ^2.3.0
  animations: ^2.0.11
  shimmer: ^3.0.0
  timezone: ^0.11.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  url_launcher: ^6.3.2
  logger: ^2.6.0
  adhan: ^2.0.0+1
  quran: ^1.4.1
  hijri: ^3.0.1
  flutter_timezone: ^5.1.0
  just_audio_background: ^0.0.1-beta.17
  wakelock_plus: ^1.7.0
  screenshot: ^3.0.0
  share_plus: ^13.3.0
  screen_brightness: ^2.1.11
  home_widget: ^0.9.3
  file_picker: ^12.0.0
  path_provider: ^2.1.6
  video_player: ^2.14.0
  speech_to_text: ^7.4.0
  sherpa_onnx: ^1.13.6
  archive: ^4.1.0
  record: ^7.1.1
  package_info_plus: ^10.2.1
  ota_update: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/video/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 700
    # Quran text faces, bundled so the reader works with no network (OFL 1.1).
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
    # Display face for headings and Surah names (SIL OFL 1.1).
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi.ttf
          weight: 400
        - asset: assets/fonts/ReemKufi.ttf
          weight: 500
        - asset: assets/fonts/ReemKufi.ttf
          weight: 600
        - asset: assets/fonts/ReemKufi.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "icon.png"
  min_sdk_size: 21
  web:
    generate: true
    image_path: "icon.png"
    background_color: "#003527"
    theme_color: "#003527"
