name: Android APK

# Always builds an installable APK on push to master.
# Replacing the rolling GitHub Release is the default for master pushes.
# Creating a kept versioned release is opt-in (tag, dispatch, or [release]).
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      update_latest:
        description: 'Replace the rolling "apk-latest" GitHub Release (deletes the previous APK)'
        type: boolean
        default: true
      create_versioned_release:
        description: 'Create a kept versioned GitHub Release (vX.Y.Z). Does not delete old versioned releases.'
        type: boolean
        default: false
      version:
        description: 'Optional version override (e.g. 1.1.0+2). Empty = pubspec.yaml'
        type: string
        required: false
        default: ''

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip apk]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. This APK is signed"
            echo "::warning::with a throwaway debug key, so it CANNOT be installed over"
            echo "::warning::a previous build. Run the 'Signing key' workflow once to fix."
            exit 0
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > android/islamic-app.jks
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          OVERRIDE="${{ github.event.inputs.version }}"
          if [ -n "${OVERRIDE}" ]; then
            BASE="${OVERRIDE%%+*}"
          else
            BASE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
            BASE="${BASE%%+*}"
          fi
          # Every build gets a strictly higher versionCode than the one before,
          # so Android always treats the new APK as an upgrade. run_number only
          # ever increases for this repository.
          CODE="${{ github.run_number }}"
          echo "name=${BASE}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "full=${BASE}+${CODE}" >> "$GITHUB_OUTPUT"
          echo "Building ${BASE} (versionCode ${CODE})"

      - name: Build release APK
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_KEYSTORE_PATH: islamic-app.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # The embedded map key. Absent secret builds a working app without
          # the map, so a fork with no Google account still gets an APK.
          #
          # It reaches the app through --dart-define and is never written to
          # the repository. It can still be read out of the APK by anyone who
          # wants to — which is why it MUST be restricted in Google Cloud
          # Console to the Maps Embed API and nothing else. That API is free
          # and uncapped, so a key that unlocks only it is a key worth nothing
          # to whoever extracts it. Restricted to anything billable, it is a
          # blank cheque.
          MAPS_EMBED_KEY: ${{ secrets.MAPS_EMBED_KEY }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --obfuscate --split-debug-info=build/app/outputs/symbols \
            --dart-define=MAPS_EMBED_KEY="${MAPS_EMBED_KEY:-}"

      - name: Verify the APK is signed with the expected key
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -1)"
          SAMPLE="$(ls build/app/outputs/flutter-apk/app-*-release.apk | head -1)"
          "$APKSIGNER" verify --print-certs "$SAMPLE" | tee signer.txt
          # A digest that changes between releases is exactly the failure this
          # whole step exists to catch, so it is printed into the build log.
          grep -i 'SHA-256 digest' signer.txt || true

      - name: Prepare APK artifacts
        id: meta
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.full }}"
          # "+" is legal in a filename but ugly in a download URL.
          FILE="${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}"
          mkdir -p dist
          shopt -s nullglob
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="${apk##*/app-}"
            abi="${abi%-release.apk}"
            cp "$apk" "dist/islamic-app-${FILE}-${abi}.apk"
            cp "$apk" "dist/islamic-app-latest-${abi}.apk"
          done
          ls -lh dist
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"
          echo "Prepared per-ABI APKs for ${FILE}"

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: islamic-app-${{ steps.meta.outputs.file }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Decide GitHub Release mode
        id: mode
        run: |
          set -euo pipefail
          UPDATE_LATEST=false
          CREATE_VERSIONED=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ github.event.inputs.update_latest }}" = "true" ] && UPDATE_LATEST=true
            [ "${{ github.event.inputs.create_versioned_release }}" = "true" ] && CREATE_VERSIONED=true
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            UPDATE_LATEST=true
            CREATE_VERSIONED=true
          else
            # Push to master: replace rolling APK. Versioned only with [release].
            UPDATE_LATEST=true
            if echo "${{ github.event.head_commit.message }}" | grep -q '\[release\]'; then
              CREATE_VERSIONED=true
            fi
          fi

          echo "update_latest=${UPDATE_LATEST}" >> "$GITHUB_OUTPUT"
          echo "create_versioned=${CREATE_VERSIONED}" >> "$GITHUB_OUTPUT"

      - name: Replace rolling apk-latest release
        if: steps.mode.outputs.update_latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Delete the previous rolling release + tag so only one preview APK exists.
          gh release delete apk-latest --cleanup-tag --yes || true
          git push origin :refs/tags/apk-latest || true

          gh release create apk-latest \
            dist/*.apk \
            --title "Latest development APK (${{ steps.meta.outputs.version }})" \
            --notes "$(cat <<EOF
          Rolling development APK. This release is replaced on every push to \`master\`.

          - Version: \`${{ steps.meta.outputs.version }}\` (versionCode \`${{ steps.version.outputs.code }}\`)
          - Signed with the project key: \`${{ steps.signing.outputs.signed }}\`
          - Commit: \`${{ github.sha }}\`
          - Branch: \`${{ github.ref_name }}\`

          Install the APK that matches the phone CPU (Honor 600 is \`arm64-v8a\`).
          The in-app updater downloads that file only — not the old 150 MB universal package.

          To keep a version forever, create a versioned release (see AGENTS.md).
          EOF
          )" \
            --prerelease \
            --latest=false

      - name: Create versioned GitHub Release
        if: steps.mode.outputs.create_versioned == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            TAG="v${VERSION%%+*}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading APK onto it."
            gh release upload "$TAG" dist/islamic-app-${{ steps.meta.outputs.file }}-*.apk --clobber
            exit 0
          fi

          gh release create "$TAG" \
            dist/islamic-app-${{ steps.meta.outputs.file }}-*.apk \
            --title "Islamic App ${VERSION}" \
            --notes "$(cat <<EOF
          Versioned release \`${VERSION}\`. This release is kept; it is not deleted by later pushes.

          - Commit: \`${{ github.sha }}\`
          EOF
          )" \
            --latest=true
