name: Signing key

# Run this once, by hand, then never again.
#
# Without a fixed signing key every CI machine mints its own throwaway debug
# key, so each APK is signed by a different signer and Android refuses to
# install it over the previous one. This mints one key, stores it as repository
# secrets, and the APK workflow picks it up from then on.
#
# The default GITHUB_TOKEN cannot write Actions secrets (HTTP 403 on
# /actions/secrets/public-key). This job needs a personal access token stored
# as SIGNING_KEY_ADMIN_TOKEN:
#   Fine-grained: this repository, Secrets = Read and write
#   Classic: repo scope
# Or mint the key on your machine: ./scripts/mint-signing-key.sh

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Type CREATE to mint a new key. This invalidates every APK signed with
          the old key: testers will have to uninstall before installing again.
        required: true
        default: ''

permissions:
  contents: read

jobs:
  mint:
    name: Mint and store the signing key
    runs-on: ubuntu-latest
    steps:
      - name: Use the key already stored locally
        id: existing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A signing key is already stored (from ./scripts/mint-signing-key.sh)."
            echo "Nothing to do here. Run the Android APK workflow to build a signed APK."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the confirmation
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "CREATE" ]; then
            echo "::error::Type CREATE to confirm. Nothing was changed."
            exit 1
          fi

      - name: Require a token that can write secrets
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.SIGNING_KEY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GITHUB_TOKEN cannot create repository secrets (HTTP 403)."
            echo "::error::Add a PAT as the SIGNING_KEY_ADMIN_TOKEN secret, then re-run."
            echo "::error::Fine-grained PAT: this repo, permission Secrets = Read and write."
            echo "::error::Classic PAT: repo scope."
            echo "::error::Or run ./scripts/mint-signing-key.sh on your machine."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/actions/secrets/public-key" --jq .key_id >/dev/null

      - name: Set up Java 17
        if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate the keystore
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Random passwords: nobody needs to memorise them, and they only ever
          # live in this repository's secrets.
          STORE_PASS="$(openssl rand -base64 24 | tr -d '/+=' | head -c 28)"
          echo "::add-mask::${STORE_PASS}"

          keytool -genkeypair -v \
            -keystore islamic-app.jks \
            -storetype JKS \
            -storepass "${STORE_PASS}" \
            -keypass "${STORE_PASS}" \
            -alias islamic-app \
            -keyalg RSA -keysize 2048 \
            -validity 10950 \
            -dname "CN=Islamic App, OU=Releases, O=if12is, L=Cairo, C=EG"

          {
            echo "STORE_PASS<<EOF"
            echo "${STORE_PASS}"
            echo "EOF"
          } >> "$GITHUB_ENV"

          base64 -w0 islamic-app.jks > keystore.b64

      - name: Store it as repository secrets
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.SIGNING_KEY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          gh secret set ANDROID_KEYSTORE_BASE64 \
            --repo "${{ github.repository }}" < keystore.b64
          gh secret set ANDROID_KEYSTORE_PASSWORD \
            --repo "${{ github.repository }}" --body "${STORE_PASS}"
          gh secret set ANDROID_KEY_PASSWORD \
            --repo "${{ github.repository }}" --body "${STORE_PASS}"
          gh secret set ANDROID_KEY_ALIAS \
            --repo "${{ github.repository }}" --body "islamic-app"
          echo "Stored. Re-run the Android APK workflow and the next build is signed."

      - name: Shred the local copies
        if: always()
        run: rm -f islamic-app.jks keystore.b64
